version: "3.9"

services:
  app:
    build: .
    container_name: registration-app
    ports:
      - "3000:3000"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
